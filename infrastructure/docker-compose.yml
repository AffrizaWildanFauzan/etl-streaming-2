# Jalankan dari root project:  make up
# (atau: docker compose -f infrastructure/docker-compose.yml up -d --build)
name: metropolia-smart-city

x-app: &app
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile
  image: metropolia-etl-app:latest
  env_file: .env
  restart: unless-stopped

services:
  # ================= STREAMING BUFFER: Kafka =================
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic traffic.flow.raw --partitions 3 --replication-factor 1 &&
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic traffic.incidents.raw --partitions 1 --replication-factor 1 &&
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic traffic.dlq --partitions 1 --replication-factor 1 &&
        $$T --bootstrap-server kafka:9092 --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: metropolia
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"

  # ================= STORAGE: PostgreSQL =================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ../storage/schema:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data

  # ================= ETL STREAMING =================
  producer:
    <<: *app
    command: ["python", "-m", "ingestion.stream.producer"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    # API key salah -> exit code 2; batasi restart agar kuota TomTom tidak terbuang
    restart: on-failure:5
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  processor:
    <<: *app
    command: ["python", "-m", "processing.stream.processor"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # ================= ETL BATCH: Airflow (scheduler) =================
  airflow:
    build:
      context: ..
      dockerfile: infrastructure/airflow.Dockerfile
    image: metropolia-airflow:latest
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW_CONN_CITY_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PYTHONPATH: /opt/airflow/project
      MODEL_DIR: /opt/airflow/models
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        (airflow users list | grep -q admin || airflow users create --username admin \
          --password "$$AIRFLOW_ADMIN_PASSWORD" --firstname Admin --lastname ETL \
          --role Admin --email admin@example.com) &&
        exec airflow standalone
    ports:
      - "8081:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../common:/opt/airflow/project/common:ro
      - ../ingestion:/opt/airflow/project/ingestion:ro
      - ../processing:/opt/airflow/project/processing:ro
      - ../storage:/opt/airflow/project/storage:ro
      - ../modeling:/opt/airflow/project/modeling:ro
      - models:/opt/airflow/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ================= SERVING: dashboard =================
  dashboard:
    <<: *app
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501",
              "--server.address=0.0.0.0", "--server.headless=true",
              "--browser.gatherUsageStats=false"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kafka-data:
  pg-data:
  models:
